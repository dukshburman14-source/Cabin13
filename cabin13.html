/* ---- BURN ---- */
{
  id:'c64', act:4, danger:0.7, title:'Kerosene and a Long Match', sound:'wood',
  text:`Fuel down the hall, up the stairs, across the table, and a puddle of it around the book like something being basted. Whoever is left stands in the doorway with the rain at their backs. You have one working lighter and the wind has opinions about it.`,
  choices:[
    { label:'Strike it.', tone:'danger', sound:'wood', effect:{ noise:0.08 },
      nextIf:[{ cond:{ has:['kerosene'] }, next:'c66' }], next:'c65' },
    { label:'Feed the tapes into the hearth first.', tone:'danger', sound:'static', next:'c67' },
    { label:'Get everyone out onto the lawn before you light anything.', tone:'safe',
      sound:'breath', effect:{ sanity:4, set:{ gotThemOut:true } },
      nextIf:[{ cond:{ has:['kerosene'] }, next:'c68' }], next:'c65' }
  ]
},
{
  id:'c65', act:4, danger:0.68, title:'No Fuel, Only Lamp Oil',
  text:`There is no kerosene. There is a half-full oil lamp, a bottle of something Pike distilled in a shed, and a house built of ninety-year-old pine, which is its own accelerant if you are patient — and you are not. You break the lamp across the table. It goes up eagerly and very unevenly, and the smoke goes the wrong way, into the room instead of out of it.`,
  choices:[
    { label:'Push the book into the flames.', tone:'danger', sound:'wood',
      effect:{ sanity:-6, noise:0.06 }, next:'c66' },
    { label:'Get everyone out and let the house do the work.', tone:'safe',
      effect:{ set:{ gotThemOut:true } }, next:'c68' },
    { label:'Add the tapes.', tone:'danger', sound:'static', next:'c67' }
  ]
},
{
  id:'c66', act:4, danger:0.78, title:'It Will Not Take Flame',
  text:`The fire takes the table, the chairs and most of the west wall, and goes around the book the way water goes around a stone. The pages do not char. The cover does not blister. The symbols on the front have rearranged themselves into an order you very nearly recognise, and Pike's margin note is suddenly legible in the firelight: <em>it burns when it is named.</em>`,
  choices:[
    { label:'Name it.', tone:'possess', sound:'growl',
      effect:{ noise:0.1 },
      effectIf:[
        { cond:{ flags:{ knowsItsName:true } }, effect:{ set:{ ledgerBurned:true }, sanity:6 } },
        { cond:{ flags:{ sealVerse:true } }, effect:{ set:{ ledgerBurned:true }, sanity:-6 } },
        { cond:{}, effect:{ sanity:-14, noise:0.12 } }
      ],
      nextIf:[{ cond:{ flags:{ ledgerBurned:true } }, next:'c68' }], next:'c67' },
    { label:'Give it your own name instead.', tone:'possess', sound:'whisper',
      effect:{ sanity:-16, noise:0.16, set:{ ledgerBurned:true, gaveName:true, youMarked:true } },
      next:'c68' },
    { label:'Take it with you and let the house burn without it.', tone:'danger', sound:'creak',
      effect:{ sanity:-4, add:['the Ledger'], set:{ ledgerCarried:true } }, next:'c68' }
  ]
},
{
  id:'c67', act:4, danger:0.76, title:'The Tapes Go In First', sound:'static',
  text:`They go in one at a time and each one screams a little in the heat, which is only plastic, which is what you keep telling the room. On the fourth, the fire changes colour to a green nobody has a name for, and Pike's voice comes out of the flames mid-sentence — still reading, still crying, eleven years too late for anybody to stop him.`,
  choices:[
    { label:'Put the book in on top of them.', tone:'danger', sound:'wood',
      effect:{ noise:0.08, set:{ ledgerBurned:true } }, next:'c68' },
    { label:'Stop. Pull the last reel back out of the fire.', tone:'safe',
      effect:{ sanity:-6, add:['tape E'] }, next:'c68' },
    { label:'Listen to what Pike is actually saying.', tone:'possess', sound:'whisper',
      effect:{ sanity:-14, noise:0.15, set:{ heardPikeBurn:true, sealVerse:true } }, next:'c68' }
  ]
},
{
  id:'c68', act:4, danger:0.82, title:'Ninety Years of Dry Pine',
  text:`It goes up like it has been waiting the whole time for somebody to give it the excuse. The heat pushes you out onto the porch, and the porch is not where you left it. Behind you, inside the fire, somebody is walking around at a completely normal pace and appears to be in no distress whatsoever.`,
  choices:[
    { label:'The road. Do not look back at it.', tone:'danger', sound:'heartbeat',
      effect:{ sanity:-6, set:{ cabinBurned:true } }, next:'c69' },
    { label:'Count heads on the lawn.', tone:'danger', sound:'static',
      effect:{ sanity:-8, noise:0.08, set:{ cabinBurned:true } }, next:'c69' },
    { label:'Go back in for whoever is still tied to a chair.', tone:'possess', sound:'growl',
      effect:{ sanity:-12, set:{ cabinBurned:true, wentBackIn:true } },
      effectIf:[
        { cond:{ aliveMax:1, anyHollow:true },
          effect:{ kill:['@ALLHOLLOW','You'], set:{ burnedThem:true } } },
        { cond:{ anyHollow:true },
          effect:{ kill:['@ALLHOLLOW'], sanity:-10, set:{ burnedThem:true } } }
      ],
      nextIf:[{ cond:{ flags:{ youDead:true } }, next:'@ENDING' }], next:'c69' }
  ]
},
{
  id:'c69', act:4, danger:0.9, title:'The Treeline Leans In',
  scare:{ art:'tree', silence:1100, delay:600 },
  text:`The fire is finally bright enough to show you the treeline properly, and the treeline is nearer than a treeline is able to get. Every trunk has bent a few degrees toward the house. Between two of them, something the height of a second storey turns its head to watch the smoke climb, and it has faces set into it like tiles, and you know several of them.`,
  choices:[
    { label:'Run for the road.', tone:'danger', sound:'heartbeat',
      effect:{ sanity:-10, noise:0.06 }, next:'c70' },
    { label:'Stand still and let it look at you.', tone:'possess', sound:'growl',
      effect:{ sanity:-16, noise:0.14, set:{ youMarked:true } },
      effectIf:[{ cond:{ sanityMax:20 }, effect:{ kill:['You'] } }],
      nextIf:[{ cond:{ flags:{ youDead:true } }, next:'@ENDING' }], next:'c70' },
    { label:'Walk. Do not run. Take everybody with you.', tone:'safe', sound:'breath',
      effect:{ sanity:-4, set:{ walkedOut:true } }, next:'c70' }
  ]
},
{
  id:'c70', act:4, danger:0.5, title:'The Road, Behind You',
  text:`The road is exactly where you left it, which is the first promise anything has kept all night. Behind you the cabin is a bright orange thumbprint on the underside of the cloud, and the counting has stopped. {n} of you walk down the centre line in the rain, and nobody suggests going back for the car.`,
  choices:[
    { label:'Keep walking until the sun is properly up.', tone:'safe', sound:'breath',
      effect:{ sanity:8 }, next:'@ENDING' },
    { label:'Wait for the fire crews and tell them the whole truth.', tone:'safe',
      effect:{ sanity:4, set:{ toldTruth:true } }, next:'@ENDING' },
    { label:'Go back for whoever you left behind.', tone:'danger', sound:'heartbeat',
      effect:{ sanity:-8 },
      nextIf:[{ cond:{ anyHollow:true }, next:'c89' }], next:'c90' }
  ]
},

/* ---- SEAL ---- */
{
  id:'c71', act:4, danger:0.6, title:'Pike’s Circle, Redrawn', sound:'drip',
  text:`You clear the long room down to bare boards and redraw Pike's circle nine times over the top of itself, the way he did, chalk worn down to the quick of your fingers. The gap goes on the north side, because north is where the well is. When you finish, the air inside the line is measurably colder than the air outside it.`,
  choices:[
    { label:'Iron next.', tone:'safe', sound:'wood',
      effect:{ set:{ circleDrawn:true } },
      effectIf:[{ cond:{ lacks:['chalk'] }, effect:{ sanity:-6, set:{ circleRough:true } } }],
      next:'c73' },
    { label:'Words first. Get the verse right before anything else.', tone:'safe',
      effect:{ set:{ circleDrawn:true } }, next:'c72' },
    { label:'Close the gap now, before anything can walk into it.', tone:'danger',
      sound:'static', effect:{ sanity:-8, noise:0.1, set:{ circleDrawn:true, gapClosed:true } },
      next:'c73' }
  ]
},
{
  id:'c72', act:4, danger:0.58, title:'One Voice, No Stopping',
  text:`Thirteen lines, one voice, no pauses, no breath in the wrong place. You practise it under your breath and the room objects: the fire lies flat, the chalk darkens, and something upstairs starts moving furniture in what is unmistakably a hurry. It is not confident. That is brand-new information and it is worth more to you than the salt is.`,
  choices:[
    { label:'Practise until you can say it without looking at the page.', tone:'safe',
      sound:'breath',
      effectIf:[
        { cond:{ flags:{ sealVerse:true } },
          effect:{ sanity:8, set:{ versePractised:true } } },
        { cond:{}, effect:{ sanity:-6, set:{ versePractised:true, sealVerse:true,
          verseIncomplete:true } } }
      ],
      next:'c73' },
    { label:'Let somebody else say it. Your voice is finished.', tone:'safe',
      effect:{ sanity:2, set:{ otherVoice:true, sealVerse:true } },
      nextIf:[{ cond:{ aliveMax:1 }, next:'c73' }], next:'c73' },
    { label:'Say it once now, quietly, just to test the shape of it.', tone:'possess',
      sound:'whisper', effect:{ sanity:-12, noise:0.14, set:{ sealVerse:true } }, next:'c73' }
  ]
},
{
  id:'c73', act:4, danger:0.64, title:'Iron at Four Points', sound:'wood',
  text:`North, south, east, west: a nail driven through the floorboard at each cardinal point, and the noise of the hammer fills the whole house like an announcement being made. On the fourth nail the walls flex — genuinely flex, in and out, twice — and then the house is a house again, and considerably smaller on the inside than it was a minute ago.`,
  choices:[
    { label:'Salt every mouth of the room.', tone:'safe', sound:'drip',
      effect:{ set:{ ironDown:true } },
      effectIf:[{ cond:{ lacks:['rock salt'] },
        effect:{ sanity:-8, set:{ saltMissing:true } } }],
      next:'c74' },
    { label:'Skip the salt. There is no time left for the salt.', tone:'danger',
      effect:{ sanity:-4, noise:0.08, set:{ ironDown:true, saltMissing:true } }, next:'c74' },
    { label:'Nail the doors shut as well.', tone:'safe', sound:'wood',
      effect:{ sanity:2, set:{ ironDown:true, doorsNailed:true } },
      effectIf:[{ cond:{ not:{ hasAny:['iron nails','bent nail'] } },
        effect:{ sanity:-10, set:{ ironShort:true } } }],
      next:'c74' }
  ]
},
{
  id:'c74', act:4, danger:0.68, title:'A Vessel That Agrees',
  text:`The last item on Pike's list is the one he wrote smallest, at the very bottom, in handwriting that had started to come apart. It needs somewhere to go. It will only go somewhere that says yes. The circle is drawn, the iron is down, the words are ready — and now the room has to work out which of you is going to be the smaller room.`,
  choices:[
    { label:'Ask. Out loud. Let somebody answer.', tone:'safe', sound:'breath',
      nextIf:[{ cond:{ aliveMin:2 }, next:'c75' }], next:'c76' },
    { label:'Volunteer.', tone:'possess', sound:'heartbeat', next:'c76' },
    { label:'Put the one who is already taken inside the circle.', tone:'danger', sound:'wood',
      nextIf:[{ cond:{ anyHollow:true }, next:'c77' }], next:'c76' }
  ]
},
{
  id:'c75', act:4, danger:0.6, title:'Somebody Steps Over the Line',
  text:`{friend} steps over the chalk before anybody has finished the sentence, and stands in the middle with their hands open, and says the thing people say when the deciding is already done. Nobody argues with them, which is the cruellest part of the whole night. They ask you to say their name at the end, so that they can hear it while there is still somebody in there to hear it.`,
  choices:[
    { label:'Say the verse.', tone:'possess', sound:'chime',
      effect:{ sanity:-14, set:{ vesselFriend:true } }, next:'c78' },
    { label:'Take their place.', tone:'possess', sound:'heartbeat',
      effect:{ sanity:4 }, next:'c76' },
    { label:'Refuse. Nobody goes in the circle.', tone:'safe',
      effect:{ sanity:-6, set:{ refusedVessel:true } }, next:'c79' }
  ]
},
{
  id:'c76', act:4, danger:0.66, title:'You Step Over the Line',
  text:`You step over it yourself, which is either courage or simply the shortest available route to not having to watch anybody else do it. The circle is warmer than the room. Somebody outside the chalk is crying and trying very hard to hide that, and somebody else has already started the first line, because they know you will change your mind if they give you the time.`,
  choices:[
    { label:'Hold still. Let them finish it.', tone:'possess', sound:'chime',
      effect:{ sanity:-10, set:{ vesselYou:true } }, next:'c78' },
    { label:'Step back out. You cannot do this.', tone:'danger', sound:'static',
      effect:{ sanity:-10, noise:0.1, set:{ refusedVessel:true } }, next:'c79' },
    { label:'Tell them to say your name at the end.', tone:'possess', sound:'breath',
      effect:{ sanity:4, set:{ vesselYou:true, nameAtEnd:true } }, next:'c78' }
  ]
},
{
  id:'c77', act:4, danger:0.74, title:'The One Already Taken',
  text:`You put {hollow} in the circle and there is no resistance at all, which frightens everybody considerably more than resistance would have. It stands where you left it, considers the chalk at its feet, and then smiles — the wide wrong one, carrying on well past where a face is supposed to end — because it has recognised the shape of the room you are building and is not impressed by the dimensions.`,
  choices:[
    { label:'Say the verse anyway.', tone:'possess', sound:'chime',
      effect:{ sanity:-8, set:{ vesselHollow:true } }, next:'c78' },
    { label:'Close the gap first. Then say it.', tone:'safe', sound:'wood',
      effect:{ sanity:3, set:{ vesselHollow:true, gapClosed:true } }, next:'c78' },
    { label:'Change your mind. Step in yourself instead.', tone:'possess', sound:'heartbeat',
      next:'c76' }
  ]
},
{
  id:'c78', act:4, danger:0.7, title:'The Room Gets Smaller', sound:'chime',
  text:`Thirteen lines, one voice, no stopping — and the room goes down to the size of a coffin, and then to the size of a jar. The chalk lifts off the boards in one continuous sheet and folds inward on itself. The pressure in your ears is the pressure of something very large being told <em>no</em> for the first time in a long, long while.`,
  choices:[
    { label:'Say the name at the end, the way they asked.', tone:'safe', sound:'breath',
      effect:{ sanity:6, set:{ ledgerSealed:true } }, next:'c79' },
    { label:'Say nothing. Let it close in silence.', tone:'safe',
      effect:{ sanity:-4, set:{ ledgerSealed:true, silentClose:true } }, next:'c79' },
    { label:'Look inside the jar before it shuts.', tone:'possess', sound:'growl',
      effect:{ sanity:-18, noise:0.16, set:{ ledgerSealed:true, lookedIn:true } }, next:'c79' }
  ]
},
{
  id:'c79', act:4, danger:0.44, title:'Sealed Is Not Gone',
  text:`It is sealed, and sealed is not the same word as gone. Something has to stay in the house with it — Pike stayed thirty-one nights and then went down the well, and you understand the well much better now than you would like to. The book is cold for the first time since you found it. Over the ridge, the sky has turned the colour of a bruise going yellow.`,
  choices:[
    { label:'Somebody stays. Not you.', tone:'danger', sound:'breath',
      effect:{ sanity:-12, set:{ wardenStays:true, wardenOther:true } },
      nextIf:[{ cond:{ aliveMin:2 }, next:'c80' }], next:'c80' },
    { label:'You stay. Send the rest of them down the road.', tone:'possess', sound:'chime',
      effect:{ sanity:-6, set:{ wardenStays:true, wardenYou:true } }, next:'c80' },
    { label:'Nobody stays. Take the book with you and go.', tone:'danger', sound:'creak',
      effect:{ sanity:-8, noise:0.1, add:['the Ledger'], set:{ ledgerCarried:true } }, next:'c80' }
  ]
},
{
  id:'c80', act:4, danger:0.3, title:'A Sound Like a Latch',
  text:`The last thing is a sound like a latch, very small, somewhere underneath the floor. Then the wind is only wind and the rain is only rain, and the counting under the boards stops in the middle of a number, which is the detail that will bother you for years. Whoever is left is still breathing. Whatever is left of the night is just night.`,
  choices:[
    { label:'Walk out.', tone:'safe', sound:'breath', effect:{ sanity:10 }, next:'@ENDING' },
    { label:'Record a tape first, for whoever comes here next.', tone:'safe', sound:'static',
      effect:{ sanity:6, set:{ recordedTape:true } }, next:'@ENDING' },
    { label:'Burn the cabin down behind you anyway.', tone:'danger', sound:'wood',
      effect:{ sanity:-4, set:{ cabinBurned:true } }, next:'@ENDING' }
  ]
},

/* ---- HOST ---- */
{
  id:'c81', act:4, danger:0.86, title:'The Invitation', sound:'whisper',
  text:`You lay the book flat on the boards and open it to the marked page, and the house stops making any noise at all. It is a courtesy. Whatever is in the walls has been waiting the entire night for somebody to be reasonable about this, and it appreciates the gesture enough to be gentle with you about what comes next.`,
  choices:[
    { label:'Read the passage forwards. All of it.', tone:'possess', sound:'growl',
      effect:{ sanity:-10, noise:0.1, set:{ youMarked:true } }, next:'c82' },
    { label:'Ask what it will cost.', tone:'possess', sound:'whisper',
      effect:{ sanity:-6 }, next:'c82' },
    { label:'Close the book. You cannot do this.', tone:'safe', sound:'wood',
      effect:{ sanity:2 }, next:'c85' }
  ]
},
{
  id:'c82', act:4, danger:0.88, title:'Your Whole Name',
  text:`It says your name. The whole thing — including the part only one person ever used, including the part you have never told anybody because it is not a word. Then it offers terms, and the terms are simple: one room, one tenant, and everybody else walks down the road at first light with their joints the right way round. It does not lie. It has never had any reason to.`,
  choices:[
    { label:'Accept the terms.', tone:'possess', sound:'growl',
      effect:{ sanity:-12, noise:0.12 }, next:'c83' },
    { label:'Ask for proof that it will really let them go.', tone:'possess', sound:'whisper',
      effect:{ sanity:-8 }, next:'c84' },
    { label:'Refuse.', tone:'danger', sound:'static',
      effect:{ sanity:-6, noise:0.1 }, next:'c85' }
  ]
},
{
  id:'c83', act:4, danger:0.95, title:'The Ledger Writes You In',
  scare:{ art:'face', silence:1150, delay:560 },
  text:`The symbols on the cover move aside, and underneath, in your own handwriting, is your name — written in the past tense. Below it, thirty-one other names, every one crossed out, and Pike's last of all, uncrossed and underlined twice, as though he got out of a thing that nobody gets out of. Something puts a hand inside your chest without opening it first.`,
  choices:[
    { label:'Let it in.', tone:'possess', sound:'growl',
      effect:{ sanity:-14 }, next:'c86' },
    { label:'Read Pike’s name aloud.', tone:'danger', sound:'chime',
      nextIf:[{ cond:{ flags:{ sealVerse:true } }, next:'c87' }], next:'c86' },
    { label:'Tear out the page with your name on it.', tone:'danger', sound:'wood',
      effect:{ sanity:-16, noise:0.14, add:['torn page'] }, next:'c85' }
  ]
},
{
  id:'c84', act:4, danger:0.9, title:'From Here They Look Small',
  text:`From wherever you are standing now, the others look a long way off and very small, like people at the far end of a corridor that has been quietly lengthening for four hours. You can see the shape of their whole lives from here, start to finish, all at once. It is very ordinary and extremely brief, and you discover that you want them to have every bit of it.`,
  choices:[
    { label:'Take the terms. Let them go.', tone:'possess', sound:'chime',
      effect:{ sanity:-8, set:{ tookTerms:true } }, next:'c86' },
    { label:'Take the terms and lie to them about what it cost.', tone:'possess', sound:'whisper',
      effect:{ sanity:-12, set:{ tookTerms:true, liedAboutIt:true } }, next:'c86' },
    { label:'Refuse, and take your chances with the sunrise.', tone:'danger', sound:'static',
      effect:{ sanity:-10, noise:0.1 }, next:'c85' }
  ]
},
{
  id:'c85', act:4, danger:0.72, title:'The Last Second',
  text:`You close the book on your own hand hard enough to break something in it, and the room comes back all at once — cold, loud, full of rain noise and somebody shouting your name from the stairs. Whatever was inside your chest withdraws with the unhurried patience of a creditor. It will be back. It has an address now, and the address is you.`,
  choices:[
    { label:'Get everyone to the road before the light.', tone:'safe', sound:'heartbeat',
      effect:{ sanity:4 }, next:'c90' },
    { label:'Deal with whoever is still in the chairs first.', tone:'danger', sound:'breath',
      nextIf:[{ cond:{ anyHollow:true }, next:'c89' }], next:'c90' },
    { label:'Burn all of it instead.', tone:'danger', sound:'wood',
      effect:{ set:{ choseBurn:true } }, next:'c64' }
  ]
},
{
  id:'c86', act:4, danger:1, title:'Yes', sound:'growl',
  text:`You say yes, and the word is the last thing that belongs entirely to you. It is not painful. It is like being read — thoroughly, page by page, by something that is taking notes — and then, after a while, it is like being the notes. Somewhere below you a door is opening for four people, because you asked for it nicely.`,
  choices:[
    { label:'Watch them go.', tone:'possess', sound:'chime',
      effect:{ hollow:['You'] }, next:'@ENDING' },
    { label:'Say their names one last time while you still can.', tone:'possess', sound:'breath',
      effect:{ hollow:['You'], set:{ namedThemLast:true } }, next:'@ENDING' },
